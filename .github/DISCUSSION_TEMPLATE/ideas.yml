title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        제안해 주셔서 고맙습니다. 작업으로 정해진 제안은 운영자가 따로 이슈로 만듭니다. 경로·토큰·비공개 코드는 적지 말아 주세요.
        Thanks for the idea. Ideas chosen for work are turned into issues by the maintainer. Please leave out paths, tokens and private code.
  - type: textarea
    id: situation
    attributes:
      label: 어떤 상황에서 필요한가요? / When do you need it?
      description: 지금 무엇이 불편한지, 어떤 작업을 하다가 필요해졌는지 적어 주세요. / What gets in your way today, and while doing what.
    validations:
      required: true
  - type: textarea
    id: wanted
    attributes:
      label: 원하는 동작 / What you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안 / Alternatives
      description: 지금 쓰는 우회 방법이나 생각해 본 다른 방법이 있으면 적어 주세요. / Workarounds you use now, or other approaches you considered.
    validations:
      required: false
